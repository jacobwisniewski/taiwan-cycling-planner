name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  deploy:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    concurrency:
      group: deploy-taiwan-planner-main
      cancel-in-progress: false

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Check commit is current main
        id: current_main
        run: |
          set -euo pipefail
          current_main_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"

          if [ "$current_main_sha" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping stale commit $GITHUB_SHA; current main is $current_main_sha"
          fi

      - if: steps.current_main.outputs.deploy == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - if: steps.current_main.outputs.deploy == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - if: steps.current_main.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.current_main.outputs.deploy == 'true'
        run: pnpm deploy -- --message "$GITHUB_SHA"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
