env:
  PNPM_VERSION: "9.0.0"

steps:
  - label: ":mag: Verify"
    key: "verify"
    commands:
      - "corepack enable"
      - "corepack prepare pnpm@$${PNPM_VERSION} --activate"
      - "pnpm install --frozen-lockfile"
      - "pnpm lint"
      - "pnpm build"

  - wait

  - label: ":cloudflare: Deploy Taiwan planner"
    key: "deploy"
    branches: "main"
    concurrency: 1
    concurrency_group: "taiwan-cycling-planner/deploy"
    commands:
      - "corepack enable"
      - "corepack prepare pnpm@$${PNPM_VERSION} --activate"
      - "pnpm install --frozen-lockfile"
      - "pnpm deploy"
